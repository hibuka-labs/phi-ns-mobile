[package]
name = "phi-ns-mobile"
version = "0.1.1"
edition = "2024"
description = "Mobile capability pack (m.*): observe/input/file over the mu broker wire"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hibuka-labs/phi-ns-mobile"
readme = "README.md"
keywords = ["agent", "capability", "codeact"]
categories = ["development-tools"]

# Assembly (`.with_ns`) happens above this crate; the pack only speaks the
# `phi-ns` contract — never codexec (sdk-assembly §9.3).
[dependencies]
phi-cap = { version = "0.1.0" }
phi-ns = { version = "0.1.0" }
async-trait = "0.1"
serde_json = "1"
# file/shell/screenshot payloads cross the wire as base64
base64 = "0.23"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tiktoken-rs = "0.12"
